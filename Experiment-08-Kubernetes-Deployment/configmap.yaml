
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport"
            content="width=device-width, initial-scale=1">
      <title>DevOps Experiment 8</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          background: #f4f7fb;
          text-align: center;
          padding: 70px 20px;
        }
        .card {
          background: white;
          padding: 35px;
          border-radius: 12px;
          max-width: 550px;
          margin: auto;
          box-shadow: 0 4px 18px #00000012;
        }
        h1 { color: #2563eb; }
        p { color: #475569; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>DevOps Laboratory</h1>
        <h2>Experiment 8</h2>
        <p>Kubernetes Deployment and Scaling</p>
        <p>Nginx application is running!</p>
      </div>
    </body>
    </html>
