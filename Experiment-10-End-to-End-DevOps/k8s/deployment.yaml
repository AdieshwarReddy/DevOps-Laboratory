
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-go-app
  labels:
    app: devops-go-app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-go-app
  template:
    metadata:
      labels:
        app: devops-go-app
    spec:
      containers:
        - name: app
          image: nginx:stable-alpine
          # Bootstrap placeholder.
          # Jenkins replaces this with the Go image.
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
